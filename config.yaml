# LungLens configuration: every tunable number lives here, so code and
# reports never hide "magic numbers". Paths are relative to the repo root.

paths:
  data_dir: data                    # override with env var LUNGLENS_DATA_DIR
  splits_csv: reports/splits.csv    # written by `python -m src.split`; committed (file names only, no images)
  model: models/lunglens.pt         # trained weights + calibration (gitignored)
  reports_dir: reports
  figures_dir: reports/figures

seed: 42
classes: [NORMAL, PNEUMONIA]        # index 0 = NORMAL, index 1 = PNEUMONIA

split:
  val_fraction: 0.20                # share of official train images moved to our val set
  # The official 16-image val folder is ignored (too small to be useful).

image:
  resize: 256                       # shorter side resized to this...
  crop: 224                         # ...then centre-cropped to this (DenseNet/ResNet input)
  mean: [0.485, 0.456, 0.406]       # ImageNet normalisation (pretrained backbone expects it)
  std: [0.229, 0.224, 0.225]

augment:                            # train split only; no horizontal flip (anatomy is not symmetric)
  rotation_deg: 7
  crop_scale: [0.85, 1.0]
  brightness: 0.15
  contrast: 0.15

model:
  backbone: densenet121             # or resnet50
  pretrained: true

train:
  batch_size: 32
  num_workers: 4
  head_epochs: 2                    # stage 1: backbone frozen, train classifier only
  head_lr: 1.0e-3
  finetune_epochs: 10               # stage 2: unfreeze everything
  finetune_lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 3            # epochs without val AUROC improvement

decision:
  target_sensitivity: 0.95          # threshold = highest one that still catches >= 95% of val pneumonia...
  max_threshold: 0.50               # ...but never above 0.5: an X-ray rated >= 50% likely is never "normal"
  inconclusive_odds_factor: 1.5     # "Inconclusive" when the odds of pneumonia are within 1.5x of the threshold's
                                    # odds: 40%-60% around a 0.5 threshold; unlike +/- 0.10 it never passes 0 or 1
  inconclusive_low: null            # optional: set BOTH to fix the band yourself, e.g. 0.30 and 0.70
  inconclusive_high: null           # (must contain the operating threshold); null = use the odds factor

ood:
  # Thresholds are set from the 4,168 TRAIN X-rays (python -m src.ood --stats -> reports/ood_xray_stats.json),
  # never tuned on the non-X-ray test images. Percentiles quoted are of the real X-rays.
  min_side_px: 150                  # 0.5th percentile of the shorter side is 186 px
  aspect_ratio_range: [0.8, 2.6]    # width/height; 0.5th-99.5th percentile 0.96-2.51 (warn only)
  max_color_diff: 12.0              # mean |R-G|,|G-B| (0-255); 99.5th percentile is 0.0 (X-rays are gray)
  min_std: 20.0                     # contrast; 0.5th percentile is 30.7
  max_frac_white: 0.30              # pixels > 235; 99.5th percentile is 0.06 (room left for white screenshot borders)
  max_frac_black: 0.55              # pixels < 20; 99.5th percentile is 0.27 (about 2x margin)
  energy_percentile: 99             # energy threshold = this percentile of val energies

explain:
  border_warn: 0.50                 # caution if > 50% of Grad-CAM weight sits in the outer 10% border band
